name: CI - Scripts
description: Matriz crash-first bash e Makefile via orquestrador

runs:
  using: composite
  steps:
    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"
    - name: Instalar Grafana k6
      uses: grafana/setup-k6-action@v1
    - name: Scripts | Lint
      shell: bash
      run: python3 scripts/operations/clean_workspace.py --area scripts --stage lint
    - name: Scripts | Seguranca
      shell: bash
      run: python3 scripts/operations/clean_workspace.py --area scripts --stage security
    - name: Scripts | Testes
      shell: bash
      run: python3 scripts/operations/clean_workspace.py --area scripts --stage test
    - name: Scripts | Validate
      shell: bash
      run: python3 scripts/operations/clean_workspace.py --area scripts --stage validate
    - name: Scripts | Build
      shell: bash
      run: python3 scripts/operations/clean_workspace.py --area scripts --stage build
