name: CI - Docker
description: Matriz crash-first Docker via orquestrador

runs:
  using: composite
  steps:
    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - name: Instalar Grafana k6
      uses: grafana/setup-k6-action@v1
    - name: Instalar Hadolint
      shell: bash
      run: |
        curl -fsSL -o /tmp/hadolint https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
        chmod +x /tmp/hadolint
        sudo mv /tmp/hadolint /usr/local/bin/hadolint
    - name: Instalar Trivy
      uses: aquasecurity/setup-trivy@v0.2.6
      with:
        version: v0.69.3
    - name: Docker | Lint
      shell: bash
      run: python3 scripts/operations/clean_workspace.py --area docker --stage lint
    - name: Docker | Seguranca
      shell: bash
      run: python3 scripts/operations/clean_workspace.py --area docker --stage security
    - name: Docker | Testes
      shell: bash
      run: python3 scripts/operations/clean_workspace.py --area docker --stage test
    - name: Docker | Validate
      shell: bash
      run: python3 scripts/operations/clean_workspace.py --area docker --stage validate
    - name: Docker | Build
      shell: bash
      run: python3 scripts/operations/clean_workspace.py --area docker --stage build
