minimum_pre_commit_version: "3.5.0"

fail_fast: true

default_language_version:
  python: python3.13

repos:
  - repo: local
    hooks:
      - id: commitlint
        name: Commitlint (Conventional Commits)
        entry: bash linters/git-hooks/commitlint.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, commit-msg]

      - id: typescript-lint
        name: "TypeScript | Lint"
        entry: linters/git-hooks/bin/python scripts/operations/clean_workspace.py --area typescript --stage lint
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: typescript-security
        name: "TypeScript | Seguranca"
        entry: linters/git-hooks/bin/python scripts/operations/clean_workspace.py --area typescript --stage security
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: typescript-test
        name: "TypeScript | Testes"
        entry: linters/git-hooks/bin/python scripts/operations/clean_workspace.py --area typescript --stage test --coverage-fail-under 100
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: typescript-validate
        name: "TypeScript | Validate"
        entry: linters/git-hooks/bin/python scripts/operations/clean_workspace.py --area typescript --stage validate
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: typescript-build
        name: "TypeScript | Build"
        entry: linters/git-hooks/bin/python scripts/operations/clean_workspace.py --area typescript --stage build
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: docker-lint
        name: "Docker | Lint"
        entry: linters/git-hooks/bin/python scripts/operations/clean_workspace.py --area docker --stage lint
        language: system
        pass_filenames: false
        always_run: true
