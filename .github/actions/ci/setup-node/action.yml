name: CI - Setup Node e Python
description: Configura Node.js 20, dependencias npm e Python 3.13

runs:
  using: composite
  steps:
    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: npm
    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - name: Instalar dependencias Node
      shell: bash
      run: npm ci
